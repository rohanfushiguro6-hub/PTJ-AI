<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PTJ AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 22px 15px;
      border-bottom: 1px solid #26304a;
    }

    .logo {
      font-size: 42px;
    }

    h1 {
      margin: 5px 0;
    }

    .subtitle {
      color: #9aa4bd;
      font-size: 14px;
    }

    main {
      width: 94%;
      max-width: 600px;
      margin: 20px auto;
    }

    .chat {
      height: 430px;
      overflow-y: auto;
      border: 1px solid #303a55;
      border-radius: 15px;
      padding: 15px;
      background: #10172a;
    }

    .message {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .message.ai {
      background: #18223a;
    }

    .message.user {
      background: #243451;
    }

    .label {
      font-size: 12px;
      color: #9aa4bd;
      margin-bottom: 5px;
    }

    .status {
      text-align: center;
      color: #8f9ab3;
      font-size: 13px;
      padding: 10px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #303a55;
      background: #11192b;
      color: white;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .send {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #30394f;
      color: white;
      margin-left: 6px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🤖</div>
  <h1>PTJ AI</h1>
  <div class="subtitle">Personal AI Assistant</div>
</header>

<main>

  <div class="chat" id="chat">
    <div class="message ai">
      <div class="label">PTJ AI</div>
      হ্যালো! 👋<br>
      আমি PTJ AI। বাংলা বা Banglish-এ command দিতে পারো।
    </div>
  </div>

  <div class="status" id="status">
    Ready ✅
  </div>

  <textarea
    id="input"
    placeholder="যেমন: Hello PTJ AI..."
  ></textarea>

  <button class="send" onclick="sendMessage()">
    🚀 Send
  </button>

  <button class="clear" onclick="clearChat()">
    🗑️ Clear Chat
  </button>

</main>

<script>

const API_URL = "https://ptj-ai.rohanfushiguro6.workers.dev/";

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");


function addMessage(text, type) {

  const box = document.createElement("div");
  box.className = "message " + type;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = type === "user" ? "You" : "PTJ AI";

  const content = document.createElement("div");
  content.textContent = text;

  box.appendChild(label);
  box.appendChild(content);

  chat.appendChild(box);

  chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {

  const prompt = input.value.trim();

  if (!prompt) {
    return;
  }

  addMessage(prompt, "user");

  input.value = "";

  statusText.textContent = "PTJ AI ভাবছে... 🤖";

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: prompt
      })

    });


    const rawText = await response.text();

    let data;

    try {
      data = JSON.parse(rawText);
    } catch {
      data = {
        error: rawText
      };
    }


    if (!response.ok) {

      let errorMessage;

      if (typeof data.error === "string") {
        errorMessage = data.error;
      } else {
        errorMessage = JSON.stringify(data.error ?? data, null, 2);
      }

      throw new Error(
        "HTTP " + response.status + "\n" + errorMessage
      );
    }


    const reply =
      typeof data.reply === "string"
        ? data.reply
        : JSON.stringify(data, null, 2);


    addMessage(reply, "ai");

    statusText.textContent = "Ready ✅";


  } catch (error) {

    addMessage(
      "❌ Error:\n" + error.message,
      "ai"
    );

    statusText.textContent = "Connection error ❌";

  }

}


function clearChat() {

  chat.innerHTML = `
    <div class="message ai">
      <div class="label">PTJ AI</div>
      Chat cleared ✅<br>
      আবার শুরু করি!
    </div>
  `;

  statusText.textContent = "Ready ✅";
}


input.addEventListener("keydown", function(e) {

  if (e.key === "Enter" && !e.shiftKey) {

    e.preventDefault();

    sendMessage();

  }

});

</script>

</body>
</html>
